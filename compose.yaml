name: docint
services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    ports: ["${API_PUBLIC_PORT:-4000}:3001"]
    networks: [internal]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      processor: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:3001/api/v1
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["${WEB_PUBLIC_PORT:-4001}:3000"]
    networks: [internal]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      api: { condition: service_healthy }

  # Internal-only document processing (PDF text, OCR, spreadsheets). Never published to the host.
  processor:
    build: { context: services/document-processor, target: runtime }
    env_file: .env
    networks: [internal]
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # One-shot: applies SQL migrations when DATABASE_PROVIDER=postgres (no-op otherwise).
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "migrate.mjs"]
    env_file: .env
    networks: [internal]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy, required: false }

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  mongo:
    profiles: [mongodb]
    image: mongo:8
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  redis:
    profiles: [bullmq]
    image: redis:8-alpine
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  # ---- optional observability stack: docker compose --profile observability up -d ----
  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["127.0.0.1:16686:16686"]
    networks: [internal]
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    environment: { METRICS_TOKEN: "${METRICS_TOKEN:-}" }
    entrypoint:
      - /bin/sh
      - -c
      - 'printf "%s" "$$METRICS_TOKEN" > /tmp/metrics-token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus'
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [internal]
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3030:3000"]
    networks: [internal]
    depends_on: [prometheus, jaeger]
    restart: unless-stopped

networks:
  internal: {}
volumes:
  pgdata: {}
  rabbitdata: {}
  miniodata: {}
  mongodata: {}
  redisdata: {}
  promdata: {}
  grafanadata: {}
