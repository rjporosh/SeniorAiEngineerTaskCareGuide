name: mongo-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: uname -r
      - name: Which MongoDB images start on this kernel?
        run: |
          for img in mongo:8 mongo:8.2 mongo:8.0 mongo:7.0; do
            docker rm -f m >/dev/null 2>&1 || true
            docker run -d --name m "$img" >/dev/null 2>&1 || { echo "RESULT $img: cannot pull/run"; continue; }
            sleep 8
            if docker exec m mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then echo "RESULT $img: OK ($(docker exec m mongod --version | head -1))"; else echo "RESULT $img: FAILED: $(docker logs m 2>&1 | grep -m1 -o 'MongoDB cannot start[^"]*' | cut -c1-120)"; fi
          done
