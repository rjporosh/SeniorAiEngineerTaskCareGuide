name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 12.18.0
  NODE_VERSION: 24

jobs:
  static-and-unit:
    name: Typecheck, lint, API and web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @docint/api typecheck
      - run: pnpm --filter @docint/api lint
      - run: pnpm --filter @docint/api test
      - run: pnpm --filter @docint/web typecheck
      - run: pnpm --filter @docint/web lint
      - run: pnpm --filter @docint/web test
      - run: pnpm --filter @docint/web build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  processor:
    name: Processor tests (OCR, PDF, spreadsheets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target test -t docint-processor-test services/document-processor
      - run: docker run --rm -e PROCESSOR_SERVICE_TOKEN=ci-token-0123456789abcdef docint-processor-test

  contracts:
    name: Adapter contracts (PostgreSQL, MongoDB, RabbitMQ, Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create a throwaway .env
        run: |
          cp .env.example .env
          sed -i "s/CHANGE_ME_postgres/$(openssl rand -hex 12)/g; s/CHANGE_ME_rabbit/$(openssl rand -hex 12)/g; s/CHANGE_ME_minio_min8chars/$(openssl rand -hex 12)/g; s/CHANGE_ME_service_token_16plus/$(openssl rand -hex 16)/; s/CHANGE_ME_jwt_secret_at_least_32_characters/$(openssl rand -hex 32)/; s/CHANGE_ME_admin_password_12plus/$(openssl rand -hex 12)/; s/CHANGE_ME_metrics_token_16plus/$(openssl rand -hex 12)/; s/CHANGE_ME_grafana_password/$(openssl rand -hex 12)/" .env
      - run: ./scripts/test-integration.sh

  e2e:
    name: Docker stack, smoke, browser journeys, evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create a throwaway .env
        run: |
          cp .env.example .env
          sed -i "s/CHANGE_ME_postgres/$(openssl rand -hex 12)/g; s/CHANGE_ME_rabbit/$(openssl rand -hex 12)/g; s/CHANGE_ME_minio_min8chars/$(openssl rand -hex 12)/g; s/CHANGE_ME_service_token_16plus/$(openssl rand -hex 16)/; s/CHANGE_ME_jwt_secret_at_least_32_characters/$(openssl rand -hex 32)/; s/CHANGE_ME_admin_password_12plus/$(openssl rand -hex 12)/; s/CHANGE_ME_metrics_token_16plus/$(openssl rand -hex 12)/; s/CHANGE_ME_grafana_password/$(openssl rand -hex 12)/" .env
      - run: docker compose up --build -d --wait
      - run: node scripts/evaluate.mjs --smoke
      - run: pnpm --filter @docint/e2e install:browsers
      # GitHub runners already ship Chromium's system libraries. Installing extras needs the Ubuntu apt mirrors, which have
      # been unreachable from the runners at times, so a failure here must not fail the job: if a library is genuinely
      # missing, the browser tests below fail loudly.
      - run: pnpm --filter @docint/e2e exec playwright install-deps chromium || echo "::warning::playwright install-deps skipped (apt mirrors unreachable)"
      - run: pnpm --filter @docint/e2e test
      - run: node scripts/evaluate.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: |
            docs/evaluation-report.md
            tests/e2e/screenshots
            tests/e2e/test-results
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: pnpm audit --prod --audit-level high
      - run: docker run --rm -v "$PWD/services/document-processor:/src:ro" python:3.13-slim sh -c "pip install -q pip-audit && pip-audit -r /src/requirements.lock"

  images:
    name: Build images and scan
    runs-on: ubuntu-latest
    needs: [static-and-unit]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t docint-api -f apps/api/Dockerfile .
      - run: docker build -t docint-web -f apps/web/Dockerfile .
      - run: docker build --target runtime -t docint-processor services/document-processor
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: docint-api, severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: docint-web, severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: docint-processor, severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }

  deploy-web:
    name: Deploy web to Vercel (optional)
    runs-on: ubuntu-latest
    needs: [static-and-unit, processor, contracts, e2e, security]
    # Runs only on main, and only when the repository opted in with VERCEL_DEPLOY=true and provided the Vercel secrets.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY == 'true' }}
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm install --global vercel@65.14.0
      - run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: vercel build --prod --token "$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
